name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Use declared npm version
        run: npm install --global npm@12.0.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit + integration tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          CI: true
          VITE_AUTH_ENABLED: "false"

      - name: Authenticated browser isolation
        run: npm run test:auth

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            screenshots
            tmp/auth-e2e-results
          if-no-files-found: ignore


  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: release_test
          POSTGRES_PASSWORD: ci-only-isolated-password
          POSTGRES_DB: realestate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_test -d realestate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --global npm@12.0.0
      - run: npm ci
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://release_test:ci-only-isolated-password@127.0.0.1:5432/realestate_test
      - name: Install Chromium for production browser verification
        run: npx playwright install --with-deps chromium
      - name: Build the production artifact
        run: npm run build
      - name: Production artifact with native PostgreSQL
        run: npm run test:auth
        env:
          TEST_DATABASE_URL: postgresql://release_test:ci-only-isolated-password@127.0.0.1:5432/realestate_test
          PLAYWRIGHT_PRODUCTION: "1"
